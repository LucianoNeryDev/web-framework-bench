# Shared nginx server block for every static (SSG) target.
# The build output is copied to /usr/share/nginx/html; routes resolve without redirects:
#   /blog            -> /blog.html or /blog/index.html
#   /blog/<slug>     -> /blog/<slug>.html or /blog/<slug>/index.html
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Fingerprinted framework assets (/_nuxt, /_next, /_astro, /_app, /assets, /build, /q-*) can be cached forever;
    # the harness does not depend on this, but it is what a real deploy would ship.
    location ~* ^/(_nuxt|_next|_astro|_app|assets|build)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
