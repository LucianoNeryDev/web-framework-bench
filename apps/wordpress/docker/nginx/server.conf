# WFB_CACHE=off: every page request runs WordPress through PHP-FPM.
# Static files (shared/public and WordPress's own assets) come from disk; everything else goes to index.php.
server {
    listen 8080;
    server_name _;
    root /var/www/wordpress;
    index index.php;

    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }
}
