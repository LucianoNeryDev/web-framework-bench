# WFB_CACHE=on: the common production setup, nginx fastcgi_cache in front of PHP-FPM.
# Pages are cached for 10 minutes, keyed on scheme, method, host and the full request URI (query string included).
# POST, admin/login/API URLs and logged-in, commenter or password cookies bypass the cache.
fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=wordpress:32m max_size=256m inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

map $request_method $wfb_skip_method {
    POST    1;
    default 0;
}
map $request_uri $wfb_skip_uri {
    "~^/(wp-admin/|wp-login\.php|xmlrpc\.php|wp-cron\.php|wp-json/)" 1;
    default 0;
}
map $http_cookie $wfb_skip_cookie {
    "~*comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in" 1;
    default 0;
}

server {
    listen 8080;
    server_name _;
    root /var/www/wordpress;
    index index.php;

    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;

        fastcgi_cache wordpress;
        fastcgi_cache_valid 200 404 10m;
        fastcgi_ignore_headers Cache-Control Expires;
        fastcgi_cache_bypass $wfb_skip_method $wfb_skip_uri $wfb_skip_cookie;
        fastcgi_no_cache $wfb_skip_method $wfb_skip_uri $wfb_skip_cookie;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }
}
