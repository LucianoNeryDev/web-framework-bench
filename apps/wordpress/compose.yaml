# WordPress target: MariaDB + PHP-FPM (WordPress, theme, mu-plugin) + nginx.
#   WFB_PORT=18190 WFB_CACHE=off docker compose -p wfb-wordpress -f apps/wordpress/compose.yaml up -d --build --wait
# WFB_CACHE=off: every request runs PHP (target `wordpress`). WFB_CACHE=on: nginx fastcgi_cache (`wordpress-cached`).
services:
  db:
    image: mariadb:12.3.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  wordpress:
    build:
      context: ../..
      dockerfile: apps/wordpress/Dockerfile
      target: wordpress
    image: wfb/wordpress:fpm
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Seeded (the entrypoint writes the flag just before starting php-fpm) and php-fpm accepting connections.
      test: ["CMD-SHELL", "test -f /tmp/wfb-ready && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

  nginx:
    build:
      context: ../..
      dockerfile: apps/wordpress/Dockerfile
      target: nginx
    image: wfb/wordpress:nginx
    environment:
      WFB_CACHE: ${WFB_CACHE:-off}
    ports:
      - "${WFB_PORT:-8080}:8080"
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      # A rendered page with its content, bypassing the page cache so the check never warms it.
      test: ["CMD-SHELL", "wget -qO- --header 'Cookie: wordpress_no_cache=1' http://127.0.0.1:8080/about | grep -q about-avatar"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 2s

volumes:
  db:
