# Ghost's url is https://bench.example: TLS is assumed to end in front of nginx, so tell Ghost the request was
# https (otherwise it 301s to https://<host>). The Host header is passed through; Ghost builds every absolute URL
# from its configured url, not from the request, so localhost:<port> and wfb-run:8080 render identically.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_pass http://ghost;
