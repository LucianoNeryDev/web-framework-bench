# WFB_CACHE=on: nginx proxy_cache in front of Ghost.
# Ghost sends "Cache-Control: public, max-age=0" for pages, so the 10-minute lifetime is set here instead.
proxy_cache ghost_pages;
proxy_cache_key $host$request_uri;
proxy_cache_valid 200 301 302 404 10m;
proxy_ignore_headers Cache-Control Expires;
proxy_cache_bypass $ghost_session;
proxy_no_cache $ghost_session;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
add_header X-Cache-Status $upstream_cache_status always;
